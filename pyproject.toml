[project]
name = "minipi-getup"
version = "0.1.0"
description = "HighTorque Mini-Pi getup task for mjlab"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mjlab[cu128]==1.6.0",
    "torch>=2.7.0,<2.10.0",
    # Pinned as a direct dependency only so the CUDA 12 wheel source below applies.
    "warp-lang==1.18.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

# PyPI warp-lang wheels are CUDA 13 builds and need a CUDA 13 driver (>= 580). NVIDIA
# publishes CUDA 12 builds only as GitHub release assets; use them on Linux x86_64 so
# the 550-series (CUDA 12.4) driver works.
[tool.uv.sources]
warp-lang = [
  { url = "https://github.com/NVIDIA/warp/releases/download/v1.18.0/warp_lang-1.18.0+cu12-py3-none-manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
indent-width = 2
src = ["src/minipi_getup"]
# Verbatim copies of HoST's rsl_rl fork (4-space indent kept for diffing).
extend-exclude = ["src/minipi_getup/host_rl"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[project.scripts]
host-train = "minipi_getup.host.train:main"
host-play = "minipi_getup.host.play:main"
host-eval = "minipi_getup.host.evaluate:main"
host-play-viser = "minipi_getup.host.play_viser:main"

[project.entry-points."mjlab.tasks"]
minipi_getup = "minipi_getup"
